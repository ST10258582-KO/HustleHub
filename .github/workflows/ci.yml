name: HustleHub+ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit
      - name: Static analysis (ESLint)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        run: docker build -t hustlehub-backend ./backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit
      - name: Static analysis (ESLint)
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        run: docker build -t hustlehub-frontend ./frontend

  api-tests:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --prefix backend
      - name: Start backend
        working-directory: backend
        env:
          USE_MONGO: "true"
          MONGO_URI: "mongodb://localhost:27017/hustlehub_ci"
          JWT_SECRET: "ci-pipeline-test-secret-32chars-ok"
          NODE_ENV: "development"
          PORT: "3443"
        run: nohup node src/server.js &
      - name: Wait for backend
        run: sleep 10
      - name: Newman API tests
        run: npx newman run postman/HustleHub-Part2.postman_collection.json --insecure --timeout-request 15000
        continue-on-error: true
